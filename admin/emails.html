<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Email — Mường Thanh</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
  <script src="admin-i18n.js"></script>
  <style>
    .email-layout { display:grid; grid-template-columns:420px 1fr; gap:0; height:calc(100vh - 56px); }

    /* LEFT PANEL */
    .email-left { border-right:1px solid var(--border); overflow-y:auto; background:var(--dark); display:flex; flex-direction:column; }
    .email-left-head { padding:1rem 1.25rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }

    .tpl-select {
      flex:1; min-width:160px; padding:.4rem .6rem;
      border:1px solid var(--border); border-radius:4px; font-size:.8rem;
      background:var(--card); color:var(--white); font-family:inherit;
    }
    .subject-row { padding:.75rem 1.25rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:.5rem; }
    .subject-row label { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); white-space:nowrap; }
    .subject-input {
      flex:1; padding:.4rem .6rem; border:1px solid var(--border); border-radius:4px;
      font-size:.85rem; background:var(--card); color:var(--white); font-family:inherit;
    }
    .subject-input:focus, .tpl-select:focus { outline:none; border-color:var(--gold); }

    /* BLOCKS LIST */
    .blocks-list { flex:1; padding:.75rem; overflow-y:auto; }
    .block-item { border:1px solid var(--border); border-radius:6px; margin-bottom:.5rem; background:var(--card); cursor:pointer; transition:border-color .2s, box-shadow .2s; }
    .block-item:hover { border-color:var(--gold); }
    .block-item.selected { border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,169,110,.15); background:rgba(201,169,110,.05); }
    .block-item-head { display:flex; align-items:center; gap:.5rem; padding:.55rem .75rem; }
    .block-type-badge { font-size:.65rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; padding:2px 7px; border-radius:3px; background:rgba(255,255,255,.08); color:var(--muted); }
    .block-type-badge.header    { background:rgba(251,191,36,.15);  color:#fbbf24; }
    .block-type-badge.text      { background:rgba(96,165,250,.15);  color:#60a5fa; }
    .block-type-badge.button    { background:rgba(52,211,153,.15);  color:#34d399; }
    .block-type-badge.divider   { background:rgba(255,255,255,.06); color:var(--muted); }
    .block-type-badge.highlight { background:rgba(167,139,250,.15); color:#a78bfa; }
    .block-type-badge.footer    { background:rgba(248,113,113,.15); color:#f87171; }
    .block-preview { font-size:.75rem; color:var(--muted); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .block-actions { display:flex; gap:2px; margin-left:auto; }
    .block-btn { background:none; border:none; cursor:pointer; padding:4px 6px; border-radius:3px; color:var(--muted); font-size:.8rem; line-height:1; transition:background .15s, color .15s; }
    .block-btn:hover { background:rgba(255,255,255,.08); color:var(--white); }
    .block-btn.del:hover { background:rgba(239,68,68,.15); color:var(--red); }

    /* BLOCK EDITOR */
    .block-editor { border-top:2px solid var(--gold); background:var(--card); padding:1rem 1.25rem; }
    .block-editor h4 { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); margin-bottom:.75rem; }
    .be-field { margin-bottom:.65rem; }
    .be-field label { display:block; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:.3rem; }
    .be-field input, .be-field textarea, .be-field select {
      width:100%; padding:.4rem .6rem; border:1px solid var(--border); border-radius:4px;
      font-size:.85rem; font-family:inherit; background:var(--dark); color:var(--white);
      box-sizing:border-box;
    }
    .be-field input:focus, .be-field textarea:focus { outline:none; border-color:var(--gold); }
    .be-field textarea { min-height:80px; resize:vertical; }
    .be-rows { border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-bottom:.5rem; }
    .be-row { display:grid; grid-template-columns:1fr 1fr 32px; gap:4px; padding:4px 6px; border-bottom:1px solid var(--border); align-items:center; }
    .be-row:last-child { border-bottom:none; }
    .be-row input { padding:3px 5px; border:1px solid var(--border); border-radius:3px; font-size:.8rem; background:var(--dark); color:var(--white); }
    .be-row-del { background:none; border:none; cursor:pointer; color:var(--red); font-size:.85rem; }
    .be-add-row { font-size:.75rem; color:var(--muted); cursor:pointer; padding:.3rem .6rem; background:none; border:none; text-decoration:underline; }
    .be-add-row:hover { color:var(--gold); }

    /* ADD BLOCK BAR */
    .add-block-bar { padding:.6rem 1.25rem; border-top:1px solid var(--border); display:flex; gap:.4rem; flex-wrap:wrap; background:var(--dark); }
    .btn-add-block {
      font-size:.7rem; font-weight:600; padding:.3rem .7rem;
      border:1px solid var(--border); border-radius:4px; cursor:pointer;
      background:var(--card); color:var(--muted);
      transition:background .15s, color .15s, border-color .15s;
      text-transform:uppercase; letter-spacing:.05em;
    }
    .btn-add-block:hover { background:var(--gold); border-color:var(--gold); color:#080808; }

    /* ACTION BAR */
    .email-action-bar { padding:.75rem 1.25rem; border-top:1px solid var(--border); display:flex; gap:.5rem; align-items:center; background:var(--dark); }
    .btn-save-tpl { background:var(--gold); color:#080808; border:none; padding:.5rem 1.2rem; font-size:.8rem; font-weight:700; border-radius:4px; cursor:pointer; letter-spacing:.05em; }
    .btn-save-tpl:hover { opacity:.85; }
    .test-email-wrap { display:flex; gap:.4rem; flex:1; justify-content:flex-end; }
    .test-email-input {
      width:180px; padding:.4rem .6rem; border:1px solid var(--border);
      border-radius:4px; font-size:.8rem; background:var(--card); color:var(--white);
    }
    .test-email-input:focus { outline:none; border-color:var(--gold); }
    .btn-test { background:var(--card); color:var(--white); border:1px solid var(--border); padding:.4rem .9rem; font-size:.75rem; font-weight:600; border-radius:4px; cursor:pointer; }
    .btn-test:hover { border-color:var(--gold); color:var(--gold); }

    /* RIGHT PANEL — PREVIEW */
    .email-right { background:var(--black); display:flex; flex-direction:column; }
    .preview-head {
      padding:.6rem 1rem; border-bottom:1px solid var(--border);
      background:var(--dark); font-size:.75rem; font-weight:600;
      color:var(--muted); text-transform:uppercase; letter-spacing:.08em;
      display:flex; align-items:center; justify-content:space-between;
    }
    .preview-subject { color:var(--white); text-transform:none; letter-spacing:0; font-weight:400; font-size:.8rem; }
    .preview-frame { flex:1; border:none; background:var(--black); }

    /* DIVIDER hint */
    .divider-hint { font-size:.8rem; color:var(--muted); font-style:italic; padding:.4rem 0; }

    /* Toast */
    .email-toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--card); color:var(--white); border:1px solid var(--border); padding:.6rem 1.2rem; border-radius:6px; font-size:.8rem; z-index:999; transition:opacity .3s; }
    .email-toast.hidden { opacity:0; pointer-events:none; }

    @media (max-width:900px) {
      .email-layout { grid-template-columns:1fr; height:auto; }
      .email-right { height:50vh; }
    }
  </style>
</head>
<body>

  <header class="adm-header">
    <a href="../index.html" class="adm-logo">Mường Thanh</a>
    <nav class="adm-nav">
      <a href="dashboard.html"  class="adm-nav-link" data-page="dashboard.html">Dashboard</a>
      <a href="index.html"      class="adm-nav-link" data-page="index.html">Đặt Phòng</a>
      <a href="customers.html"  class="adm-nav-link" data-page="customers.html">Khách Hàng</a>
      <a href="hotels.html"     class="adm-nav-link" data-page="hotels.html">Khách Sạn</a>
      <a href="rooms.html"      class="adm-nav-link" data-page="rooms.html">Phòng</a>
      <a href="staff.html"      class="adm-nav-link" data-page="staff.html">Nhân Viên</a>
      <a href="reviews.html"    class="adm-nav-link" data-page="reviews.html">Reviews</a>
      <a href="promotions.html" class="adm-nav-link" data-page="promotions.html">Khuyến Mãi</a>
      <a href="payments.html"   class="adm-nav-link" data-page="payments.html">Thanh Toán</a>
      <a href="emails.html"     class="adm-nav-link active" data-page="emails.html">Email</a>
      <a href="settings.html"   class="adm-nav-link" data-page="settings.html">Cài Đặt</a>
          <a href="chat.html" class="adm-nav-link">Live Chat</a>
    </nav>
  </header>

  <div class="email-layout">

    <!-- LEFT: EDITOR -->
    <div class="email-left">
      <div class="email-left-head">
        <select class="tpl-select" id="tplSelect" onchange="loadTemplate(this.value)">
          <option value="" data-adm-i18n="email.select_template">— Chọn template —</option>
        </select>
        <select class="tpl-select" id="activeSelect" style="max-width:110px;" onchange="setActive(this.value)">
          <option value="1" data-adm-i18n="email.active">● Bật</option>
          <option value="0" data-adm-i18n="email.inactive">○ Tắt</option>
        </select>
      </div>

      <div class="subject-row">
        <label data-adm-i18n="email.subject_label">Tiêu đề</label>
        <input class="subject-input" id="subjectInput" type="text" placeholder="Subject email..."/>
      </div>

      <div class="blocks-list" id="blocksList"></div>

      <div class="block-editor" id="blockEditor" style="display:none;"></div>

      <div class="add-block-bar">
        <span style="font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;align-self:center;" data-adm-i18n="email.add_block">Thêm:</span>
        <button class="btn-add-block" onclick="addBlock('header')">Header</button>
        <button class="btn-add-block" onclick="addBlock('text')">Text</button>
        <button class="btn-add-block" onclick="addBlock('button')">Button</button>
        <button class="btn-add-block" onclick="addBlock('highlight')">Box</button>
        <button class="btn-add-block" onclick="addBlock('divider')">---</button>
        <button class="btn-add-block" onclick="addBlock('footer')">Footer</button>
      </div>

      <div class="email-action-bar">
        <button class="btn-save-tpl" onclick="saveTemplate()" data-adm-i18n="email.btn_save">Lưu template</button>
        <div class="test-email-wrap">
          <input class="test-email-input" id="testEmail" type="email" placeholder="email@test.com"/>
          <button class="btn-test" onclick="sendTest()" data-adm-i18n="email.btn_test">Gửi thử</button>
        </div>
      </div>
    </div>

    <!-- RIGHT: PREVIEW -->
    <div class="email-right">
      <div class="preview-head">
        <span data-adm-i18n="email.preview">Xem trước email</span>
        <span id="previewSubject" class="preview-subject"></span>
      </div>
      <iframe class="preview-frame" id="previewFrame"></iframe>
    </div>
  </div>

  <div class="email-toast hidden" id="toast"></div>

  <script>
  let templates  = [];
  let currentCode = '';
  let blocks      = [];
  let selectedIdx = -1;

  const BLOCK_DEFAULTS = {
    header:    { type:'header',    logo:'Mường Thanh', title:'Tiêu đề email', subtitle:'' },
    text:      { type:'text',      content:'Nội dung đoạn văn...' },
    button:    { type:'button',    text:'Xem ngay', url:'https://muongthanh.online', color:'#c9a96e' },
    divider:   { type:'divider' },
    highlight: { type:'highlight', title:'Thông tin', rows:[{label:'Mục 1', value:'Giá trị 1'}] },
    footer:    { type:'footer',    content:'© 2026 Mường Thanh.\nChuỗi khách sạn tư nhân lớn nhất Đông Dương.' },
  };

  // ===== INIT =====
  async function init() {
    const res  = await fetch('../api/emails.php');
    const data = await res.json();
    templates  = data.templates || [];
    const sel  = document.getElementById('tplSelect');
    templates.forEach(t => {
      const o = document.createElement('option');
      o.value = t.code; o.textContent = t.name;
      sel.appendChild(o);
    });
    if (templates.length) loadTemplate(templates[0].code);
  }

  async function loadTemplate(code) {
    if (!code) return;
    currentCode = code;
    document.getElementById('tplSelect').value = code;
    const res  = await fetch('../api/emails.php?code=' + code);
    const data = await res.json();
    const tpl  = data.template;
    blocks      = tpl.blocks || [];
    selectedIdx = -1;
    document.getElementById('subjectInput').value  = tpl.subject   || '';
    document.getElementById('activeSelect').value  = tpl.is_active ? '1' : '0';
    document.getElementById('blockEditor').style.display = 'none';
    renderBlockList();
    refreshPreview();
  }

  // ===== RENDER BLOCK LIST =====
  function renderBlockList() {
    const list = document.getElementById('blocksList');
    if (!blocks.length) {
      list.innerHTML = `<p style="text-align:center;color:var(--muted);font-size:.8rem;padding:2rem;">${tAdm('email.no_blocks')}</p>`;
      return;
    }
    list.innerHTML = blocks.map((b, i) => `
      <div class="block-item ${selectedIdx === i ? 'selected' : ''}" onclick="selectBlock(${i})">
        <div class="block-item-head">
          <span class="block-type-badge ${b.type}">${b.type}</span>
          <span class="block-preview">${blockPreviewText(b)}</span>
          <div class="block-actions">
            <button class="block-btn" onclick="moveBlock(${i},-1,event)" title="Lên">↑</button>
            <button class="block-btn" onclick="moveBlock(${i},1,event)"  title="Xuống">↓</button>
            <button class="block-btn del" onclick="deleteBlock(${i},event)" title="Xóa">✕</button>
          </div>
        </div>
      </div>`).join('');
  }

  function blockPreviewText(b) {
    if (b.type === 'header')    return b.title || b.logo || '';
    if (b.type === 'text')      return (b.content || '').substring(0, 60);
    if (b.type === 'button')    return b.text || '';
    if (b.type === 'highlight') return b.title || '';
    if (b.type === 'footer')    return (b.content || '').substring(0, 60);
    if (b.type === 'divider')   return '— — — — — — —';
    return '';
  }

  // ===== BLOCK SELECTION & EDITOR =====
  function selectBlock(i) {
    selectedIdx = i;
    renderBlockList();
    renderEditor(blocks[i]);
  }

  function renderEditor(b) {
    const ed   = document.getElementById('blockEditor');
    ed.style.display = 'block';
    const type = b.type;

    let html = `<h4>${tAdm('email.edit_label')} — ${type}</h4>`;

    if (type === 'header') {
      html += field('email.lbl_logo',     'text',  'logo',     b.logo)
            + field('email.lbl_title',    'text',  'title',    b.title)
            + field('email.lbl_subtitle', 'text',  'subtitle', b.subtitle);
    } else if (type === 'text') {
      html += fieldArea('email.lbl_content', 'content', b.content);
    } else if (type === 'button') {
      html += field('email.lbl_btn_text',  'text',  'text',  b.text)
            + field('email.lbl_btn_url',   'text',  'url',   b.url)
            + field('email.lbl_btn_color', 'color', 'color', b.color || '#c9a96e');
    } else if (type === 'highlight') {
      html += field('email.lbl_box_title', 'text', 'title', b.title);
      html += `<div class="be-field"><label>${tAdm('email.lbl_rows')}</label><div class="be-rows" id="beRows">`;
      (b.rows || []).forEach((r, ri) => {
        html += `<div class="be-row">
          <input placeholder="${tAdm('email.lbl_label')}" value="${esc(r.label)}" oninput="updateRow(${ri},'label',this.value)"/>
          <input placeholder="${tAdm('email.lbl_value')}" value="${esc(r.value)}" oninput="updateRow(${ri},'value',this.value)"/>
          <button class="be-row-del" onclick="deleteRow(${ri})">✕</button>
        </div>`;
      });
      html += `</div><button class="be-add-row" onclick="addRow()">${tAdm('email.add_row')}</button></div>`;
    } else if (type === 'footer') {
      html += fieldArea('email.lbl_content', 'content', b.content);
    } else if (type === 'divider') {
      html += `<p class="divider-hint">${tAdm('email.lbl_divider')}</p>`;
    }

    ed.innerHTML = html;

    ed.querySelectorAll('input[data-field], textarea[data-field]').forEach(el => {
      el.addEventListener('input', () => {
        blocks[selectedIdx][el.dataset.field] = el.value;
        renderBlockList();
        refreshPreview();
      });
    });
  }

  function field(i18nKey, type, key, val = '') {
    return `<div class="be-field">
      <label>${tAdm(i18nKey)}</label>
      <input type="${type}" data-field="${key}" value="${esc(val||'')}"/>
    </div>`;
  }
  function fieldArea(i18nKey, key, val = '') {
    return `<div class="be-field">
      <label>${tAdm(i18nKey)}</label>
      <textarea data-field="${key}">${esc(val||'')}</textarea>
    </div>`;
  }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  function updateRow(ri, key, val) {
    if (!blocks[selectedIdx].rows) blocks[selectedIdx].rows = [];
    blocks[selectedIdx].rows[ri][key] = val;
    refreshPreview();
  }
  function deleteRow(ri) {
    blocks[selectedIdx].rows.splice(ri, 1);
    renderEditor(blocks[selectedIdx]);
    refreshPreview();
  }
  function addRow() {
    if (!blocks[selectedIdx].rows) blocks[selectedIdx].rows = [];
    blocks[selectedIdx].rows.push({ label: tAdm('email.lbl_label'), value: tAdm('email.lbl_value') });
    renderEditor(blocks[selectedIdx]);
    refreshPreview();
  }

  // ===== BLOCK ACTIONS =====
  function addBlock(type) {
    blocks.push(JSON.parse(JSON.stringify(BLOCK_DEFAULTS[type])));
    selectedIdx = blocks.length - 1;
    renderBlockList();
    renderEditor(blocks[selectedIdx]);
    refreshPreview();
  }

  function moveBlock(i, dir, e) {
    e.stopPropagation();
    const j = i + dir;
    if (j < 0 || j >= blocks.length) return;
    [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
    if (selectedIdx === i) selectedIdx = j;
    renderBlockList();
    refreshPreview();
  }

  function deleteBlock(i, e) {
    e.stopPropagation();
    blocks.splice(i, 1);
    selectedIdx = -1;
    document.getElementById('blockEditor').style.display = 'none';
    renderBlockList();
    refreshPreview();
  }

  // ===== PREVIEW =====
  function refreshPreview() {
    document.getElementById('previewSubject').textContent = document.getElementById('subjectInput').value;
    const html  = buildPreviewHtml();
    document.getElementById('previewFrame').srcdoc = html;
  }

  function buildPreviewHtml() {
    const rows = blocks.map(b => `<tr><td>${renderBlockJs(b)}</td></tr>`).join('');
    return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#080808;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#080808;">
<tr><td align="center" style="padding:24px 8px;">
<table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">
${rows}</table></td></tr></table>
</body></html>`;
  }

  function renderBlockJs(b) {
    const e  = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const nl = s => e(s||'').replace(/\n/g,'<br>');
    const t  = b.type;
    if (t === 'header') return `<table width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f0f;"><tr><td style="padding:36px 36px 28px;text-align:center;">
      <div style="font-family:Georgia,serif;font-size:22px;font-weight:300;letter-spacing:8px;color:#c9a96e;text-transform:uppercase;">${e(b.logo||'Mường Thanh')}</div>
      ${b.title    ? `<div style="font-family:Arial,sans-serif;font-size:19px;font-weight:300;color:#f5f0ea;margin-top:16px;line-height:1.4;">${e(b.title)}</div>` : ''}
      ${b.subtitle ? `<div style="font-family:Arial,sans-serif;font-size:12px;color:rgba(245,240,234,0.5);margin-top:7px;">${e(b.subtitle)}</div>` : ''}
    </td></tr></table>`;
    if (t === 'text') return `<table width="100%" cellpadding="0" cellspacing="0" style="background:#161616;"><tr><td style="padding:24px 36px;font-family:Arial,sans-serif;font-size:15px;line-height:1.8;color:rgba(245,240,234,0.85);">${nl(b.content)}</td></tr></table>`;
    if (t === 'button') return `<table width="100%" cellpadding="0" cellspacing="0" style="background:#161616;"><tr><td style="padding:14px 36px 32px;text-align:center;"><a href="${e(b.url||'#')}" style="display:inline-block;background:${e(b.color||'#c9a96e')};color:#080808;font-family:Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-decoration:none;padding:13px 40px;">${e(b.text||'Xem ngay')}</a></td></tr></table>`;
    if (t === 'divider') return `<table width="100%" cellpadding="0" cellspacing="0" style="background:#161616;"><tr><td style="padding:6px 36px;"><div style="height:1px;background:rgba(255,255,255,0.08);"></div></td></tr></table>`;
    if (t === 'highlight') {
      const rowsHtml = (b.rows||[]).map(r=>`<tr>
        <td style="padding:5px 0;font-family:Arial,sans-serif;font-size:13px;color:rgba(245,240,234,0.5);width:45%;vertical-align:top;">${e(r.label)}</td>
        <td style="padding:5px 0;font-family:Arial,sans-serif;font-size:13px;color:#f5f0ea;font-weight:600;">${e(r.value)}</td>
      </tr>`).join('');
      return `<table width="100%" cellpadding="0" cellspacing="0" style="background:#161616;"><tr><td style="padding:8px 36px 24px;"><table width="100%" cellpadding="14" cellspacing="0" style="border:1px solid rgba(201,169,110,0.25);background:rgba(201,169,110,0.06);">${b.title?`<tr><td colspan="2" style="padding-bottom:10px;font-family:Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#c9a96e;">${e(b.title)}</td></tr>`:''}${rowsHtml}</table></td></tr></table>`;
    }
    if (t === 'footer') return `<table width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f0f;"><tr><td style="padding:24px 36px;font-family:Arial,sans-serif;font-size:12px;line-height:1.7;color:rgba(245,240,234,0.3);text-align:center;">${nl(b.content)}</td></tr></table>`;
    return '';
  }

  // ===== SAVE =====
  async function saveTemplate() {
    if (!currentCode) return;
    await fetch('../api/emails.php?code=' + currentCode, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        subject:   document.getElementById('subjectInput').value,
        is_active: parseInt(document.getElementById('activeSelect').value),
        blocks
      })
    });
    showToast(tAdm('email.saved'));
  }

  async function setActive(val) {
    if (!currentCode) return;
    await fetch('../api/emails.php?code=' + currentCode, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ is_active: parseInt(val) })
    });
  }

  // ===== SEND TEST =====
  async function sendTest() {
    const email = document.getElementById('testEmail').value.trim();
    if (!email) { showToast(tAdm('email.enter_email')); return; }
    await saveTemplate();
    const res  = await fetch('../api/emails.php?action=send_test', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: currentCode, email })
    });
    const data = await res.json();
    showToast(data.message || (data.success ? tAdm('email.sent') : tAdm('email.send_fail')));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3000);
  }

  init();
  </script>
  <script src="admin-auth.js"></script>
</body>
</html>
